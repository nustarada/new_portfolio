<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#09090f"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Top nav bar -->
  <rect width="800" height="44" fill="#111118" opacity="0.95"/>
  <rect x="0" y="43" width="800" height="1" fill="#ffffff" opacity="0.06"/>

  <!-- Nav: breadcrumb -->
  <circle cx="22" cy="22" r="6" fill="#10b981" opacity="0.9"/>
  <rect x="36" y="17" width="48" height="10" rx="3" fill="#ffffff" opacity="0.12"/>
  <text x="90" y="25" font-size="9" fill="#ffffff" opacity="0.3" font-family="monospace">/</text>
  <rect x="100" y="17" width="80" height="10" rx="3" fill="#10b981" opacity="0.25"/>
  <rect x="100" y="17" width="80" height="10" rx="3" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
  <text x="108" y="25" font-size="7.5" fill="#10b981" font-family="monospace" opacity="0.9">Proconomics</text>

  <!-- Nav right: tab pills -->
  <g opacity="0.7">
    <rect x="580" y="14" width="46" height="16" rx="8" fill="#ffffff" opacity="0.06"/>
    <text x="591" y="25" font-size="7" fill="#ffffff" opacity="0.6" font-family="monospace">Summary</text>
    <rect x="634" y="14" width="40" height="16" rx="8" fill="#10b981" opacity="0.18"/>
    <rect x="634" y="14" width="40" height="16" rx="8" fill="none" stroke="#10b981" stroke-width="0.7" opacity="0.5"/>
    <text x="643" y="25" font-size="7" fill="#10b981" font-family="monospace">Detail</text>
    <rect x="682" y="14" width="38" height="16" rx="8" fill="#ffffff" opacity="0.06"/>
    <text x="691" y="25" font-size="7" fill="#ffffff" opacity="0.6" font-family="monospace">Report</text>
  </g>

  <!-- Left panel: Costs vs Benefits header -->
  <text x="30" y="76" font-size="9" fill="#ffffff" opacity="0.25" font-family="monospace" letter-spacing="0.12em">COST-BENEFIT ANALYSIS</text>
  <text x="30" y="92" font-size="18" fill="#ffffff" font-family="sans-serif" font-weight="700" opacity="0.92">Project ROI Breakdown</text>

  <!-- ROI hero number -->
  <text x="430" y="76" font-size="9" fill="#10b981" opacity="0.6" font-family="monospace">NET ROI</text>
  <text x="430" y="108" font-size="38" fill="#10b981" font-family="sans-serif" font-weight="800" filter="url(#glow)">+247%</text>
  <text x="430" y="124" font-size="8" fill="#ffffff" opacity="0.3" font-family="monospace">projected over 18 months</text>

  <!-- Stat cards row -->
  <g>
    <!-- Card 1: Total Costs -->
    <rect x="28" y="120" width="120" height="56" rx="8" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.07"/>
    <text x="38" y="137" font-size="7" fill="#f43f5e" font-family="monospace" opacity="0.8">TOTAL COST</text>
    <text x="38" y="155" font-size="17" fill="#ffffff" font-family="sans-serif" font-weight="700" opacity="0.9">$48,200</text>
    <text x="38" y="168" font-size="7" fill="#ffffff" font-family="monospace" opacity="0.25">implementation</text>

    <!-- Card 2: Total Benefits -->
    <rect x="158" y="120" width="120" height="56" rx="8" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.07"/>
    <text x="168" y="137" font-size="7" fill="#10b981" font-family="monospace" opacity="0.8">TOTAL BENEFIT</text>
    <text x="168" y="155" font-size="17" fill="#ffffff" font-family="sans-serif" font-weight="700" opacity="0.9">$167,600</text>
    <text x="168" y="168" font-size="7" fill="#ffffff" font-family="monospace" opacity="0.25">annual savings</text>

    <!-- Card 3: Payback -->
    <rect x="288" y="120" width="110" height="56" rx="8" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.07"/>
    <text x="298" y="137" font-size="7" fill="#f59e0b" font-family="monospace" opacity="0.8">PAYBACK</text>
    <text x="298" y="155" font-size="17" fill="#ffffff" font-family="sans-serif" font-weight="700" opacity="0.9">3.5 mo</text>
    <text x="298" y="168" font-size="7" fill="#ffffff" font-family="monospace" opacity="0.25">break-even point</text>
  </g>

  <!-- Bar chart: monthly comparison -->
  <text x="30" y="208" font-size="7.5" fill="#ffffff" opacity="0.22" font-family="monospace" letter-spacing="0.08em">MONTHLY COST vs BENEFIT COMPARISON</text>

  <!-- Chart area background -->
  <rect x="28" y="215" width="370" height="160" rx="6" fill="#ffffff" opacity="0.015"/>
  <rect x="28" y="215" width="370" height="160" rx="6" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Y-axis gridlines inside chart -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="60" y1="222" x2="390" y2="222"/>
    <line x1="60" y1="248" x2="390" y2="248"/>
    <line x1="60" y1="274" x2="390" y2="274"/>
    <line x1="60" y1="300" x2="390" y2="300"/>
    <line x1="60" y1="326" x2="390" y2="326"/>
    <line x1="60" y1="352" x2="390" y2="352"/>
  </g>

  <!-- Benefit bars (green) -->
  <g>
    <rect x="70"  y="310" width="18" height="42" rx="2" fill="url(#bar1)" opacity="0.75"/>
    <rect x="110" y="295" width="18" height="57" rx="2" fill="url(#bar1)" opacity="0.8"/>
    <rect x="150" y="272" width="18" height="80" rx="2" fill="url(#bar1)" opacity="0.85"/>
    <rect x="190" y="258" width="18" height="94" rx="2" fill="url(#bar1)" opacity="0.88"/>
    <rect x="230" y="245" width="18" height="107" rx="2" fill="url(#bar1)" opacity="0.9"/>
    <rect x="270" y="238" width="18" height="114" rx="2" fill="url(#bar1)" opacity="0.92"/>
    <rect x="310" y="232" width="18" height="120" rx="2" fill="url(#bar1)" opacity="0.95"/>
    <rect x="350" y="228" width="18" height="124" rx="2" fill="url(#bar1)"/>
  </g>
  <!-- Cost bars (red) - flat/smaller -->
  <g>
    <rect x="92"  y="326" width="12" height="26" rx="2" fill="url(#bar2)" opacity="0.65"/>
    <rect x="132" y="329" width="12" height="23" rx="2" fill="url(#bar2)" opacity="0.65"/>
    <rect x="172" y="332" width="12" height="20" rx="2" fill="url(#bar2)" opacity="0.65"/>
    <rect x="212" y="334" width="12" height="18" rx="2" fill="url(#bar2)" opacity="0.65"/>
    <rect x="252" y="335" width="12" height="17" rx="2" fill="url(#bar2)" opacity="0.65"/>
    <rect x="292" y="336" width="12" height="16" rx="2" fill="url(#bar2)" opacity="0.65"/>
    <rect x="332" y="337" width="12" height="15" rx="2" fill="url(#bar2)" opacity="0.65"/>
    <rect x="372" y="337" width="12" height="15" rx="2" fill="url(#bar2)" opacity="0.65"/>
  </g>

  <!-- X-axis labels -->
  <g font-size="7" fill="#ffffff" opacity="0.22" font-family="monospace">
    <text x="72"  y="370">M1</text>
    <text x="112" y="370">M2</text>
    <text x="152" y="370">M3</text>
    <text x="192" y="370">M4</text>
    <text x="232" y="370">M5</text>
    <text x="272" y="370">M6</text>
    <text x="312" y="370">M7</text>
    <text x="352" y="370">M8</text>
  </g>

  <!-- Legend -->
  <rect x="55" y="378" width="8" height="6" rx="1" fill="#10b981"/>
  <text x="68" y="385" font-size="7" fill="#ffffff" opacity="0.4" font-family="monospace">Benefits</text>
  <rect x="115" y="378" width="8" height="6" rx="1" fill="#f43f5e"/>
  <text x="128" y="385" font-size="7" fill="#ffffff" opacity="0.4" font-family="monospace">Costs</text>

  <!-- Right panel: breakdown list -->
  <text x="430" y="150" font-size="7.5" fill="#ffffff" opacity="0.22" font-family="monospace" letter-spacing="0.08em">COST CATEGORIES</text>

  <!-- Cost breakdown items -->
  <g>
    <rect x="428" y="158" width="340" height="36" rx="6" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    <rect x="438" y="168" width="4" height="16" rx="2" fill="#f43f5e" opacity="0.7"/>
    <text x="450" y="172" font-size="9" fill="#ffffff" opacity="0.75" font-family="sans-serif">Implementation &amp; Setup</text>
    <text x="450" y="185" font-size="7.5" fill="#ffffff" opacity="0.3" font-family="monospace">one-time</text>
    <text x="710" y="178" font-size="10" fill="#f43f5e" opacity="0.8" font-family="sans-serif" font-weight="600">$28,000</text>

    <rect x="428" y="200" width="340" height="36" rx="6" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    <rect x="438" y="210" width="4" height="16" rx="2" fill="#f97316" opacity="0.7"/>
    <text x="450" y="214" font-size="9" fill="#ffffff" opacity="0.75" font-family="sans-serif">Training &amp; Onboarding</text>
    <text x="450" y="227" font-size="7.5" fill="#ffffff" opacity="0.3" font-family="monospace">per team · quarterly</text>
    <text x="710" y="220" font-size="10" fill="#f97316" opacity="0.8" font-family="sans-serif" font-weight="600">$12,400</text>

    <rect x="428" y="242" width="340" height="36" rx="6" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    <rect x="438" y="252" width="4" height="16" rx="2" fill="#a78bfa" opacity="0.7"/>
    <text x="450" y="256" font-size="9" fill="#ffffff" opacity="0.75" font-family="sans-serif">Maintenance &amp; Support</text>
    <text x="450" y="269" font-size="7.5" fill="#ffffff" opacity="0.3" font-family="monospace">annual recurring</text>
    <text x="710" y="262" font-size="10" fill="#a78bfa" opacity="0.8" font-family="sans-serif" font-weight="600">$7,800</text>
  </g>

  <text x="430" y="300" font-size="7.5" fill="#ffffff" opacity="0.22" font-family="monospace" letter-spacing="0.08em">BENEFIT CATEGORIES</text>

  <g>
    <rect x="428" y="308" width="340" height="36" rx="6" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    <rect x="438" y="318" width="4" height="16" rx="2" fill="#10b981" opacity="0.8"/>
    <text x="450" y="322" font-size="9" fill="#ffffff" opacity="0.75" font-family="sans-serif">Time Saved on Decision Making</text>
    <text x="450" y="335" font-size="7.5" fill="#ffffff" opacity="0.3" font-family="monospace">8.4 hrs/wk per PM</text>
    <text x="700" y="328" font-size="10" fill="#10b981" opacity="0.9" font-family="sans-serif" font-weight="600">$94,200</text>

    <rect x="428" y="350" width="340" height="36" rx="6" fill="#ffffff" opacity="0.02" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    <rect x="438" y="360" width="4" height="16" rx="2" fill="#34d399" opacity="0.8"/>
    <text x="450" y="364" font-size="9" fill="#ffffff" opacity="0.75" font-family="sans-serif">Reduced Scope Creep &amp; Rework</text>
    <text x="450" y="377" font-size="7.5" fill="#ffffff" opacity="0.3" font-family="monospace">fewer failed projects</text>
    <text x="700" y="370" font-size="10" fill="#34d399" opacity="0.9" font-family="sans-serif" font-weight="600">$73,400</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="444" width="800" height="6" fill="#10b981" opacity="0.15"/>
  <rect x="0" y="444" width="200" height="6" fill="#10b981" opacity="0.6"/>

  <!-- Acedboard label bottom right -->
  <text x="700" y="436" font-size="8" fill="#ffffff" opacity="0.18" font-family="monospace">Acedboard · Proconomics</text>
</svg>
