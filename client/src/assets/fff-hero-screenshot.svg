<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#heroGrad)"/>
  
  <!-- Header Navigation -->
  <rect x="0" y="0" width="1200" height="80" fill="#0f0f23" opacity="0.9"/>
  <text x="60" y="50" fill="#ffffff" font-size="24" font-weight="bold" font-family="Arial">FutureFirstFamilies</text>
  <text x="1000" y="50" fill="#4fc3f7" font-size="16" font-family="Arial">Join the Movement</text>
  
  <!-- Main Hero Section -->
  <text x="600" y="200" fill="#ffffff" font-size="48" font-weight="bold" text-anchor="middle" font-family="Arial">Transform Learning.</text>
  <text x="600" y="260" fill="#ffffff" font-size="48" font-weight="bold" text-anchor="middle" font-family="Arial">Empower your Child.</text>
  <text x="600" y="320" fill="#4fc3f7" font-size="48" font-weight="bold" text-anchor="middle" font-family="Arial">Influence your school.</text>
  
  <text x="600" y="400" fill="#cccccc" font-size="24" text-anchor="middle" font-family="Arial">Curriculum time just got shorter. The result?</text>
  <text x="600" y="440" fill="#4fc3f7" font-size="32" font-weight="bold" text-anchor="middle" font-family="Arial">Smarter.</text>
  
  <!-- CTA Button -->
  <rect x="500" y="500" width="200" height="60" fill="#4fc3f7" rx="30"/>
  <text x="600" y="540" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial">Join the Parent Movement</text>
  
  <!-- Trust Indicators -->
  <text x="200" y="650" fill="#888888" font-size="16" text-anchor="middle" font-family="Arial">Trusted by educators</text>
  <text x="600" y="650" fill="#888888" font-size="16" text-anchor="middle" font-family="Arial">Loved by families</text>
  <text x="1000" y="650" fill="#888888" font-size="16" text-anchor="middle" font-family="Arial">Built for your child</text>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="300" r="3" fill="#4fc3f7" opacity="0.6"/>
  <circle cx="1050" cy="250" r="4" fill="#4fc3f7" opacity="0.4"/>
  <circle cx="100" cy="500" r="2" fill="#4fc3f7" opacity="0.8"/>
  <circle cx="1100" cy="450" r="3" fill="#4fc3f7" opacity="0.5"/>
</svg>