  <rect x="660" y="170" width="250" height="150" fill="#ffffff" rx="8" opacity="0.1"/>
  <text x="785" y="220" fill="#4fc3f7" font-size="48" font-weight="bold" text-anchor="middle" font-family="Arial">38%</text>
