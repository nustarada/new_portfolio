<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#compGrad)"/>
  
  <!-- Header -->
  <text x="600" y="60" fill="#1a1a2e" font-size="32" font-weight="bold" text-anchor="middle" font-family="Arial">See How 2 Hour Learning Transforms Results</text>
  <text x="600" y="100" fill="#666666" font-size="18" text-anchor="middle" font-family="Arial">Compare traditional learning vs. mastery-based 2 Hour Learning</text>
  <text x="600" y="130" fill="#4fc3f7" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial">Students double their growth in half the time.</text>
  
  <!-- Comparison Cards -->
  <!-- Traditional Approach -->
  <rect x="80" y="180" width="480" height="450" fill="#ffffff" rx="12" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="80" y="180" width="480" height="60" fill="#ff6b6b" rx="12"/>
  <text x="320" y="220" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial">Traditional School</text>
  
  <text x="320" y="270" fill="#1a1a2e" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial">Conventional classroom approach</text>
  
  <circle cx="120" cy="310" r="4" fill="#ff6b6b"/>
  <text x="140" y="315" fill="#666666" font-size="16" font-family="Arial">Full-day schedule</text>
  
  <circle cx="120" cy="340" r="4" fill="#ff6b6b"/>
  <text x="140" y="345" fill="#666666" font-size="16" font-family="Arial">Same pace for all</text>
  
  <circle cx="120" cy="370" r="4" fill="#ff6b6b"/>
  <text x="140" y="375" fill="#666666" font-size="16" font-family="Arial">The teacher teaches the students</text>
  
  <circle cx="120" cy="400" r="4" fill="#ff6b6b"/>
  <text x="140" y="405" fill="#666666" font-size="16" font-family="Arial">Passive and uniform</text>
  
  <!-- Progress Bar Traditional -->
  <rect x="120" y="460" width="400" height="20" fill="#f0f0f0" rx="10"/>
  <rect x="120" y="460" width="120" height="20" fill="#ff6b6b" rx="10"/>
  <text x="320" y="505" fill="#666666" font-size="14" text-anchor="middle" font-family="Arial">Slower Progress</text>
  
  <!-- 2 Hour Learning -->
  <rect x="640" y="180" width="480" height="450" fill="#ffffff" rx="12" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="640" y="180" width="480" height="60" fill="#4fc3f7" rx="12"/>
  <text x="880" y="220" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial">2HL-Powered School</text>
  
  <text x="880" y="270" fill="#1a1a2e" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial">Mastery-based learning approach</text>
  
  <circle cx="680" cy="310" r="4" fill="#4fc3f7"/>
  <text x="700" y="315" fill="#666666" font-size="16" font-family="Arial">2 focused hours for core subject learning</text>
  
  <circle cx="680" cy="340" r="4" fill="#4fc3f7"/>
  <text x="700" y="345" fill="#666666" font-size="16" font-family="Arial">Personalized lessons by skill level</text>
  
  <circle cx="680" cy="370" r="4" fill="#4fc3f7"/>
  <text x="700" y="375" fill="#666666" font-size="16" font-family="Arial">Teacher guides for individual mastery</text>
  
  <circle cx="680" cy="400" r="4" fill="#4fc3f7"/>
  <text x="700" y="405" fill="#666666" font-size="16" font-family="Arial">Active, accelerated, and limitless</text>
  
  <!-- Progress Bar 2HL -->
  <rect x="680" y="460" width="400" height="20" fill="#f0f0f0" rx="10"/>
  <rect x="680" y="460" width="320" height="20" fill="#4fc3f7" rx="10"/>
  <text x="880" y="505" fill="#666666" font-size="14" text-anchor="middle" font-family="Arial">2x Faster Progress</text>
  
  <!-- Bottom Achievement -->
  <rect x="300" y="680" width="600" height="80" fill="#4fc3f7" rx="8" opacity="0.1"/>
  <text x="600" y="710" fill="#1a1a2e" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial">Alpha High School boosted reading and math scores</text>
  <text x="600" y="735" fill="#4fc3f7" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial">by 85% in just 8 weeks.</text>
</svg>